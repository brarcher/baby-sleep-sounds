// https://docs.gradle.org/current/userguide/upgrading_version_5.html#the_findbugs_plugin_has_been_removedhttps://docs.gradle.org/current/userguide/upgrading_version_5.html#the_findbugs_plugin_has_been_removed
plugins {
    id "com.android.application"
}

android {
    namespace "protect.babysleepsounds"
    compileSdkVersion 33
    defaultConfig {
        applicationId "protect.babysleepsounds"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 15
        versionName "0.11"
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        disable 'GoogleAppIndexingWarning', 'MissingTranslation'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.2'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'com.google.guava:guava:18.0'
    implementation group: 'io.github.maitrungduc1410', name: 'ffmpeg-kit-min', version: '6.0.0'
}

